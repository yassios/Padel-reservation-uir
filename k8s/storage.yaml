# Storage is inside this kind node's Docker container, not on the macOS host.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mini-projet-postgres
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: mini-projet
    name: postgres-data
  hostPath:
    path: /var/local/mini-projet/postgres
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [learning-worker]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  storageClassName: ""
  volumeName: mini-projet-postgres
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
